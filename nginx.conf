server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dokploy's Traefik terminates TLS and sets X-Forwarded-*; don't redirect here.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed filenames (index-ByG2an9X.js) are content-addressed -> cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or users get a stale bundle after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The app uses HashRouter (/#/about), so the server only ever sees "/".
    # This fallback is just a safety net if routing changes to BrowserRouter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
